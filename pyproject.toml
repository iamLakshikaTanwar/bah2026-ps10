[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irchroma"
version = "0.1.0"
description = "End-to-end IR satellite image super-resolution + semantically-faithful IR→RGB colorization (BAH 2026 PS-10)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BAH 2026 PS-10 Team" }]
keywords = [
    "infrared", "colorization", "super-resolution", "remote-sensing",
    "landsat", "satellite", "image-to-image-translation", "semantic-segmentation",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
]

# ---------------------------------------------------------------------------
# Core runtime dependencies (the runnable framework). Heavy/optional providers
# (Earth Engine, TensorRT, TiTiler serving) are split into extras below so the
# base install stays light and CI-friendly. NOTE: config.py + interfaces.py have
# NO hard dependency on any of these (stdlib + guarded torch/omegaconf only).
# ---------------------------------------------------------------------------
dependencies = [
    # deep learning
    "torch>=2.1",
    "torchvision>=0.16",
    "einops>=0.7",
    # numerics / imaging
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "opencv-python-headless>=4.8",
    "colour-science>=0.4",
    "matplotlib>=3.7",
    # geospatial IO / streaming (COG range reads, STAC)
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "pystac-client>=0.7",
    "h3>=4.0",
    # config / utils
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "tqdm>=4.65",
    # metrics (image quality)
    "torchmetrics>=1.2",
    "lpips>=0.1.4",
    "pyiqa>=0.1.10",
    "clean-fid>=0.1.35",
    "sewar>=0.4.5",
    "piq>=0.8",
    # semantic guidance / downstream
    "segmentation-models-pytorch>=0.3",
]

[project.optional-dependencies]
# Google Earth Engine + Planetary Computer access (server-side pairing/export).
gee = [
    "earthengine-api>=0.1.380",
    "planetary-computer>=1.0",
    "stackstac>=0.5",
    "odc-stac>=0.3",
    "arosics>=1.9",            # sub-pixel co-registration
]
# Fast tile-serving layer (FastAPI + TiTiler + Redis cache).
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "titiler.core>=0.18",
    "rio-tiler>=6.0",
    "redis>=5.0",
]
# Optimized inference runtimes.
trt = [
    "onnx>=1.15",
    "onnxruntime-gpu>=1.17",
    "tensorrt>=8.6",
    "fvcore>=0.1.5",          # FLOPs/MACs for efficiency metrics
]
# Downstream detection (oriented bbox) evaluation.
detect = [
    "ultralytics>=8.1",
    "pycocotools>=2.0.7",
]
# Energy/carbon accounting for the efficiency family (optional).
energy = [
    "pynvml>=11.5",
    "codecarbon>=2.3",
]
# Everything for development.
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.urls]
Homepage = "https://github.com/divyamohan1993/bah2026-ps10"
Documentation = "https://github.com/divyamohan1993/bah2026-ps10/blob/main/ARCHITECTURE.md"

[project.scripts]
# Wired up by Builder-7 (train/infer/serve CLIs). Stable entrypoint names.
irchroma-train = "irchroma.train.cli:main"
irchroma-infer = "irchroma.infer.cli:main"
irchroma-eval = "irchroma.metrics.cli:main"
irchroma-serve = "irchroma.serve.app:main"

# ---------------------------------------------------------------------------
# src/ layout
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["irchroma*"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length handled by black

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
files = ["src/irchroma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
